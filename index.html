<style>
/* Good Nature home (departments), drawn on GitHub so it opens instantly. Same layout as the Vaquero departments
   page (31/10/2026), in the Good Nature colours. Each app still checks who may open it. */
:root{--brown:#86593d;--brown2:#a0704f;--deep:#5c3a24;--gold:#c9962e;--bg:#f6f2ec;--ink:#2a211b;--mut:#776b61;--line:#e7dfd5}
html,body{margin:0;min-height:100%;background:var(--bg);font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
[dir=rtl] body{font-family:Tahoma,"Segoe UI",Arial,sans-serif}
header{position:relative;background:var(--deep);color:#fff;text-align:center;padding:calc(max(env(safe-area-inset-top),14px) + 8px) 20px 12px}
header .logo svg{display:block;margin:0 auto;width:120px;max-width:40vw;height:auto;filter:brightness(0) invert(1)}
.sub{font-size:11px;letter-spacing:.32em;color:var(--gold);font-weight:600;margin-top:4px}
[dir=rtl] .sub{letter-spacing:0;font-size:13px}
.hello{margin-top:2px;font-size:12px;font-weight:500;color:rgba(255,255,255,.72)}
.lang{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px;background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:600;font-family:inherit;cursor:pointer}
[dir=rtl] .lang{right:auto;left:14px}
main{padding:28px 18px calc(28px + env(safe-area-inset-bottom))}
.apps{display:flex;flex-wrap:wrap;justify-content:center;gap:18px;max-width:1100px;margin:0 auto}
.app{flex:0 1 300px;display:flex;flex-direction:column;align-items:center;text-align:center;text-decoration:none;color:inherit;background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px 22px;transition:transform .12s ease,box-shadow .12s ease,border-color .12s ease}
a.app:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(92,58,36,.14);border-color:var(--gold)}
a.app:active{transform:scale(.98)}
.icon{font-size:34px;line-height:1}
.name{margin-top:14px;font-family:Poppins,-apple-system,"Segoe UI",sans-serif;font-size:18px;font-weight:600;color:var(--deep)}
[dir=rtl] .name{font-family:Tahoma,"Segoe UI",Arial,sans-serif}
.what{flex:1;margin-top:8px;font-size:13px;color:var(--mut);line-height:1.5}
.go{margin-top:18px;display:inline-block;background:var(--brown);color:#fff;border-radius:8px;padding:8px 22px;font-size:13px;font-weight:600}
#hint{display:none;max-width:420px;margin:22px auto 0;text-align:center;font-size:13px;color:var(--mut);line-height:1.6}
.foot{margin-top:26px;text-align:center;font-size:12px;color:#9a8c7f}
#splash{position:fixed;inset:0;z-index:100;background:#FAF6F0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;transition:opacity .25s ease}
#splash.out{opacity:0;pointer-events:none}#splash svg{width:260px;max-width:76vw;height:auto}
#splash .spin{width:26px;height:26px;border-radius:50%;border:3px solid #E6D8CB;border-top-color:#8B4F2E;animation:gnspin .9s linear infinite}@keyframes gnspin{to{transform:rotate(360deg)}}
/* Needs attention, under the cards (31/10/2026): loaded in the background from the Good Nature app */
#att{max-width:1100px;margin:22px auto 0}
.att{background:#fff;border:1px solid var(--line);border-inline-start:4px solid #a05a00;border-radius:14px;padding:12px 16px 4px;text-align:start}
.atth{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;padding:0 0 4px;margin:0;font:inherit;color:inherit;cursor:pointer;text-align:start}
.atth h3{margin:0;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#a05a00}
[dir=rtl] .atth h3{letter-spacing:0;font-size:13px}
.atth .cnt{min-width:22px;height:20px;padding:0 7px;border-radius:999px;background:#fff4e0;color:#a05a00;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.atth .chev{margin-inline-start:auto;color:var(--mut);font-size:16px;transition:transform .2s ease}
.att.closed{padding-bottom:10px}.att.closed .ail{display:none}.att.closed .chev{transform:rotate(-90deg)}[dir=rtl] .att.closed .chev{transform:rotate(90deg)}
.ai{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px solid var(--line);text-decoration:none;color:var(--ink);line-height:1.45;font-size:14px}
.ail .ai:first-child{border-top:0}
.ai .dot{flex-shrink:0;width:8px;height:8px;border-radius:50%;background:#a05a00;margin-top:6px}.ai.hot .dot{background:#b3261e}
.ai .tx{flex:1;min-width:0;overflow-wrap:anywhere}.ai .gt{flex-shrink:0;color:var(--mut)}[dir=rtl] .ai .gt{transform:scaleX(-1)}
.ai:hover .tx{color:var(--deep);text-decoration:underline}
.att.ok{border:0;background:#e6f4ea;color:#1e7d45;font-weight:600;font-size:13px;padding:12px 16px}
@media (max-width:640px){main{padding:18px 14px;display:flex;flex-direction:column}.app{flex:1 1 100%;padding:22px 18px}#att{order:-1;width:100%;margin:0 0 18px}#att:empty{margin:0}}
.atth .asof{font-size:11px;color:var(--mut);font-weight:500}
.acct{text-align:center;font-size:12px;opacity:.8;margin-top:14px;line-height:1.8}.acct button{color:inherit;text-decoration:underline;background:none;border:0;font:inherit;cursor:pointer;padding:0}.acct input{font:inherit;padding:6px 8px;border:1px solid #c9b8a6;border-radius:8px;width:230px;max-width:62vw}.acct form button{text-decoration:none;border:1px solid #8B4F2E;border-radius:8px;padding:6px 12px;margin-inline-start:6px}
</style>
<style id="gn-theme">@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap');/* Good Nature theme (24/11/2026, from the Good Nature design system 'Raw Elements, farm to table'). */:root{--brown:#a8431f;--brown2:#c5522e;--deep:#1f1f1f;--gold:#d69434;--bg:#efe6db;--ink:#1f1f1f;--mut:#5e5a52;--line:#d8cdbf}html,body{font-family:'Inter','IBM Plex Sans Arabic',Arial,sans-serif;font-variant-numeric:tabular-nums}[dir=rtl] body{font-family:'IBM Plex Sans Arabic','Inter',Tahoma,sans-serif}header{background:#1f1f1f;color:#f9f6ee;border-bottom:3px solid #c5522e}.sub{color:#e8d9b5}.hello{color:rgba(249,246,238,.75)}.lang{background:rgba(249,246,238,.08);color:#f9f6ee;border-color:rgba(249,246,238,.35)}.app{background:#f9f6ee;border-radius:10px}a.app:hover{box-shadow:none;border-color:#c5522e}.name{font-family:'Montserrat','IBM Plex Sans Arabic',Arial,sans-serif;font-weight:700;color:#1f1f1f}[dir=rtl] .name{font-family:'IBM Plex Sans Arabic',Tahoma,sans-serif}.go{background:#a8431f;color:#f9f6ee;border-radius:10px}.foot{color:#5e5a52}.att{background:#f9f6ee;border-radius:10px}#splash{background:#f9f6ee}#splash .spin{border-color:#d8cdbf;border-top-color:#c5522e}:focus-visible{outline:2px solid #2563c9;outline-offset:2px}img.gn-new-logo{filter:none!important;mix-blend-mode:normal!important;background:none!important;padding:0!important;height:44px!important;width:auto!important;max-width:200px;opacity:1!important}#splash{background:#f9f6ee!important}#splash .spin{border-color:#d8cdbf!important;border-top-color:#c5522e!important}</style>
</head>
